version: '3.8'

services:
  link-shortener:
    build:
      context: .
      dockerfile: Dockerfile
      cache_from:
        - link-shortener-app:latest
    container_name: link-shortener-app
    restart: always
    expose:
      - "3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT:-5432}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME:-postgres}
      - DB_SSL=${DB_SSL:-false}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-1h}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - JWT_REFRESH_EXPIRES_IN=${JWT_REFRESH_EXPIRES_IN:-7d}
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      # === DOMAIN AYARLARI (Sadece bu 2 değişkeni ayarlamanız yeterli) ===
      # ADMIN_DOMAIN  = Yönetim paneli domaini (Örn: panel.sirket.com)
      # SYSTEM_DOMAIN = Kısaltma domaini (Örn: go.sirket.com)
      - ADMIN_DOMAIN=${ADMIN_DOMAIN}
      - SYSTEM_DOMAIN=${SYSTEM_DOMAIN}
    labels:
      - "coolify.managed=true"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
