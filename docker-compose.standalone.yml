version: '3.8'

services:
  admin-panel:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: link-shortener-admin
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - PORT=3000
      - APP_MODE=admin
      - SYSTEM_DOMAIN=${SYSTEM_DOMAIN:-go.example.com}
      - SHORTENER_FQDN=${SHORTENER_FQDN:-go.example.com}
      - ADMIN_DOMAIN=${ADMIN_DOMAIN:-admin.example.com}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT:-5432}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME:-postgres}
      - DB_SSL=${DB_SSL:-false}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-1h}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - JWT_REFRESH_EXPIRES_IN=${JWT_REFRESH_EXPIRES_IN:-7d}
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  shortener-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: link-shortener-engine
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - PORT=3000
      - APP_MODE=shortener
      - SYSTEM_DOMAIN=${SYSTEM_DOMAIN:-go.example.com}
      - SHORTENER_FQDN=${SHORTENER_FQDN:-go.example.com}
      - ADMIN_DOMAIN=${ADMIN_DOMAIN:-admin.example.com}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT:-5432}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME:-postgres}
      - DB_SSL=${DB_SSL:-false}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-1h}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - JWT_REFRESH_EXPIRES_IN=${JWT_REFRESH_EXPIRES_IN:-7d}
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  caddy:
    build:
      context: .
      dockerfile: Dockerfile.caddy
    container_name: link-shortener-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - admin-panel
      - shortener-engine

volumes:
  caddy_data:
  caddy_config:
